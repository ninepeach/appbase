name: Android Core
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android-core.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Android build
        working-directory: android
        run: gradle --no-daemon :core:assembleDebug :ui:assembleDebug
      - name: Kotlin smoke
        run: bash android/tests/run.sh
